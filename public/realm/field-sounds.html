<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전장 소리 고르기</title>
<style>
  :root { color-scheme: dark; }
  body { background:#171c23; color:#e2dbcd; margin:0; padding:20px 16px 140px; font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { color:#95a1ae; font-size:13px; line-height:1.7; max-width:780px; margin:6px 0 10px; }
  .slot { border-top:1px solid #2c333d; padding:10px 0 6px; }
  .sh { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; } .sh b { font-size:15px; } .sh small { color:#8f99a5; }
  .opt { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:5px 0 5px 8px; }
  .opt label { display:flex; align-items:center; gap:6px; min-width:220px; flex:1; font-size:13px; color:#ccd6e0; cursor:pointer; }
  .opt code { background:#232a33; padding:1px 5px; border-radius:3px; color:#ffd88f; font-size:12px; }
  .opt .d { color:#7f8b98; font-size:11.5px; }
  .opt a { color:#8fb7e8; font-size:12px; }
  #out { position:fixed; left:0; right:0; bottom:0; background:#0f1318f2; border-top:1px solid #4a4030; padding:10px 16px; }
  #out textarea { width:100%; box-sizing:border-box; height:56px; background:#1b2028; color:#ffd88f; border:1px solid #3a4250; border-radius:8px; font:12px/1.5 monospace; }
  #out .r { display:flex; gap:8px; align-items:center; margin-bottom:6px; font-size:13px; color:#95a1ae; }
  #out button { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid #e0bd78; background:#7d5a22; color:#fff4dc; cursor:pointer; }
</style></head><body>
<h1>전장 소리 고르기</h1>
<p>새 전투 시험장에서 아직 소리가 없는 자리입니다. 자리마다 후보가 셋(없으면 둘)입니다. 파일은 아직 받지 않았으니 제목 옆 「소개 쪽」 링크로 공유마당에서 먼저 들어 보세요. 마음에 드는 것을 고르면 아래 칸에 적히니, 복사해서 알려 주세요. 고른 것만 받아 넣습니다.</p>
<p>이미 고르신 소리(깃발 · 함성 · 북 · 화살비 · 쇳소리 · 문 · 나팔)는 그대로 쓰고 있어 여기에 없습니다. 후보는 모두 공공누리 제1유형 또는 CC BY 입니다.</p>
<div id="list"></div>
<div id="out"><div class="r">고른 것 <span id="n">0</span>곳 <button id="cp">복사</button><span id="ok"></span></div><textarea id="ta" readonly placeholder="자리마다 후보를 고르면 여기에 적힙니다"></textarea></div>
<script>
const W = 'https://gongu.copyright.or.kr/gongu/wrt/wrt/view.do?wrtSn='
const DATA = [
  { slot: 'step_walk', name: '걷는 발소리', when: '걷는 보병 · 사람 수만큼 박자대로 겹쳐 냅니다', opts: [
    { code: 'a', t: '발_흙길_부츠_남자_천천히걷기', n: 13264257, lic: 'CC BY', len: '8초' },
    { code: 'b', t: '발_흙길_구두_남자_천천히걷기', n: 13264256, lic: 'CC BY', len: '12초' },
    { code: 'c', t: '발_흙길_고무신_여자_천천히걷기', n: 13264254, lic: 'CC BY', len: '12초' } ] },
  { slot: 'step_run', name: '달리는 발소리', when: '돌격으로 달리는 보병', opts: [
    { code: 'a', t: '발_흙길_운동화_남자_신발신고뛰어가기', n: 13264262, lic: 'CC BY', len: '6초' },
    { code: 'b', t: '발_나무판자_운동화_남자_달리기', n: 13264157, lic: 'CC BY', len: '6초' },
    { code: 'c', t: '발_흙길_고무신_어린이_달리기', n: 13264251, lic: 'CC BY', len: '6초' } ] },
  { slot: 'hoof_walk', name: '말발굽 걷기', when: '기병이 걸어 다닐 때 · 빠르기 따라 박자가 빨라집니다', opts: [
    { code: 'a', t: '말 발굽 걷는1', n: 13253320, lic: 'CC BY', len: '26초' },
    { code: 'b', t: '말발굽(아스팔트)', n: 13253347, lic: 'CC BY', len: '15초' },
    { code: 'x', t: '없음 (셋째를 못 찾았습니다)', n: 0, lic: '', len: '' } ] },
  { slot: 'hoof_gallop', name: '말발굽 질주', when: '기병이 돌격으로 달릴 때 · 다그닥다그닥', opts: [
    { code: 'a', t: '말 여러마리 뛰는', n: 13253321, lic: 'CC BY', len: '5초' },
    { code: 'b', t: '말발굽(아스팔트)', n: 13253347, lic: 'CC BY', len: '15초' },
    { code: 'x', t: '없음 (셋째를 못 찾았습니다)', n: 0, lic: '', len: '' } ] },
  { slot: 'impact', name: '부딪힘 쾅', when: '돌격이 처음 맞붙는 순간 · 사람 수가 많을수록 큽니다', opts: [
    { code: 'a', t: '몸_부딪히기_철_세게', n: 13264030, lic: 'CC BY', len: '2초' },
    { code: 'b', t: '몸_부딪히기_세게', n: 13264029, lic: 'CC BY', len: '' },
    { code: 'c', t: '몸_부딪히기_화살_세게', n: 13264031, lic: 'CC BY', len: '2초' } ] },
  { slot: 'rout', name: '무너지는 함성', when: '사기가 꺾여 무너질 때', opts: [
    { code: 'a', t: '비명_20대남자_1', n: 13372428, lic: '공공누리 1유형', len: '13초' },
    { code: 'b', t: '비명_20대남자_2', n: 13372429, lic: '공공누리 1유형', len: '8초' },
    { code: 'c', t: 'LSMSE0308_비명', n: 13312685, lic: 'CC BY', len: '29초 (잘라 씁니다)' } ] },
  { slot: 'arrow_hit', name: '꽂히는 화살', when: '화살이 맞는 순간 (자리만 잡아 둡니다)', opts: [
    { code: 'a', t: '화살 맞는2', n: 13254995, lic: 'CC BY', len: '2초' },
    { code: 'b', t: '화살 맞는1', n: 13254994, lic: 'CC BY', len: '1초' },
    { code: 'c', t: '화살이 과녁에 맞을때 나는 나무 부서지는 소리', n: 13221015, lic: 'CC BY', len: '3초' } ] },
]
const pick = {}
const list = document.getElementById('list')
let h = ''
for (const s of DATA) {
  h += `<div class="slot"><div class="sh"><b>${s.name}</b><small>${s.when}</small></div>`
  s.opts.forEach((o, i) => {
    const link = o.n ? `<a href="${W}${o.n}" target="_blank" rel="noopener">소개 쪽</a>` : ''
    h += `<div class="opt"><label><input type="radio" name="${s.slot}" value="${i}"><code>${o.code}</code>${o.t}<span class="d">${o.lic} ${o.len}</span></label>${link}</div>`
  })
  h += '</div>'
}
list.innerHTML = h
list.addEventListener('change', (e) => {
  const r = e.target
  const s = DATA.find((x) => x.slot === r.name)
  const o = s.opts[Number(r.value)]
  pick[s.slot] = `${s.name} (${s.slot}) → ${o.code} ${o.t}${o.n ? ' [' + o.n + ']' : ''}`
  const v = Object.values(pick)
  document.getElementById('ta').value = v.join('\n')
  document.getElementById('n').textContent = v.length
})
document.getElementById('cp').onclick = async () => {
  const t = document.getElementById('ta').value
  try { await navigator.clipboard.writeText(t); document.getElementById('ok').textContent = '복사했습니다' } catch { document.getElementById('ta').select() }
}
</script></body></html>
