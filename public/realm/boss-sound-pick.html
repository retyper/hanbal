<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>불가사리 소리 고르기</title>
<style>
  :root { color-scheme: dark; }
  body { background:#171c23; color:#e2dbcd; margin:0; padding:20px 16px 60px; font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
  h1 { font-size:20px; margin:0 0 6px; }
  h2 { font-size:16px; color:#ffb347; margin:28px 0 2px; }
  p { color:#95a1ae; font-size:13px; line-height:1.7; max-width:760px; margin:6px 0 10px; }
  .row { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; max-width:560px; }
  button { font:inherit; min-height:72px; padding:10px 8px; border-radius:10px; border:1px solid #4a5363; background:#2a313c; color:#e2dbcd; cursor:pointer; display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
  button b { font-size:15px; word-break:keep-all; text-align:center; line-height:1.3; }
  button small { color:#8f99a5; font-size:10px; line-height:1.4; word-break:break-all; text-align:center; }
  button:active { transform:scale(.95); }
  button.on { background:#a57a31; border-color:#e0bd78; color:#fff; }
  button.on small { color:#fff4dc; }
</style></head><body>
<h1>불가사리 소리 고르기</h1>
<p>불가사리(쇠를 먹는 큰 괴물)의 공격과 부위가 끊길 때 소리 후보입니다. 단추를 누르면 소리가 나고, 다시 누르면 멈춥니다. 마음에 드는 것을 이름으로 말해 주세요 (예: 「공격은 3 · 끊길 때는 2」). 다 별로면 「다시」라고 해 주세요.</p>
<h2>공격</h2>
<p>들이받거나 내리찍거나 무는 순간입니다.</p>
<div class="row" id="attack"></div>
<h2>부위가 끊길 때</h2>
<p>철갑이 깨져 떨어져 나가는 순간입니다.</p>
<div class="row" id="hurt"></div>
<script>
const C = {
  attack: [
    ['Giant Monster Stomp', 'JoelEleven · CC0 · 1.3초'],
    ['monster bite', 'LucasDuff · CC0 · 1.6초'],
    ['Monster Bite on Armor', 'OGsoundFX · CC BY 4.0 · 1.8초'],
    ['Seismic Slam', 'magnuswaker · CC0 · 2.2초']
  ],
  hurt: [
    ['Big falling debris (crash)', 'xkeril · CC0 · 2.5초'],
    ['CrashingMetalObjects', 'Sclolex · CC0 · 2.6초'],
    ['Steelwire Rupture', 'zenosounds · CC BY 4.0 · 1.8초'],
    ['metal crash with glass debris', 'Artninja · CC BY 4.0 · 2.2초']
  ]
}
const NAME = { attack: '공격', hurt: '부위 끊김' }
let cur = null, curBtn = null
function stop() { if (cur) cur.pause(); if (curBtn) curBtn.classList.remove('on'); cur = null; curBtn = null }
function mk(label, sub, file) {
  const b = document.createElement('button')
  b.innerHTML = '<b>' + label + '</b><small>' + sub + '</small>'
  b.onclick = () => {
    const same = curBtn === b
    stop()
    if (same) return
    const a = new Audio('sfx/cand/raid/' + file)
    cur = a; curBtn = b; b.classList.add('on')
    a.onended = () => { if (curBtn === b) stop() }
    a.onerror = () => { if (curBtn === b) stop() }
    a.play().catch(() => { if (curBtn === b) stop() })
  }
  return b
}
for (const k of ['attack', 'hurt']) {
  C[k].forEach(([t, s], i) => {
    document.getElementById(k).append(mk('불가사리 ' + NAME[k] + ' ' + (i + 1), '원 제목 ' + t + ' · Freesound · ' + s, 'raid_boss_bulgasari_' + k + '_h' + (i + 1) + '.ogg'))
  })
}
</script></body></html>
