<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>칠십팔국 목소리 고르기</title>
<style>
  :root { color-scheme: dark; }
  body { background:#171c23; color:#e2dbcd; margin:0; padding:22px 16px 60px; font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
  h1 { font-size:20px; letter-spacing:.06em; margin:0 0 6px; }
  h2 { font-size:15px; letter-spacing:.1em; color:#ffb347; margin:26px 0 4px; }
  p { color:#95a1ae; font-size:13px; line-height:1.7; max-width:760px; margin:6px 0 10px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:9px 0; border-top:1px solid #2c333d; }
  .no { font-weight:700; color:#ffb347; min-width:34px; font-size:15px; }
  .nm { font-size:13px; color:#ccd6e0; flex:1; min-width:160px; }
  .pick { color:#7fd17a; font-size:12px; }
  audio { height:34px; max-width:100%; }
  code { background:#232a33; padding:1px 5px; border-radius:3px; color:#ffd88f; }
</style></head><body>
<div id="hire"></div>
<h1>칠십팔국 목소리 고르기 — 장수를 누르면 나오는 대답</h1>
<p>우리 장수 얼굴을 누르거나 장수가 이끄는 군대를 지도에서 고르면 그 장수가 곧바로 대답한다. 장수마다 아홉 결 가운데 하나 — 생김·특성·능력치로 고른다 (<code>src/ui/realm/voice.ts</code>).
결마다 대답 셋을 돌려 쓴다. 구글 AI 스튜디오 Gemini TTS(무료 목소리 + 사극 말투 지시)로 뽑았다.</p>
<p>★ 나는 소리를 못 듣는다 — 빈 소리로 잘랐다. 어색한 결·대사는 "○○ 다시"라고 말해 주면 그 결만 다시 뽑는다.</p>
<div id="list"></div>
<script>
const GROUPS = [
  ['남 · 젊은 무사 (Enzo) — 특성 없는 젊은 장수 · 겁 많음', 'm-young', ['네!', '부르셨습니까!', '명만 내리십시오!']],
  ['남 · 거친 노장 (Daro) — 무예 높음 · 술꾼 · 잔치꾼 · 대장장이 · 철의 손', 'm-gruff', ['예이!', '무슨 일이오!', '싸울 일이오?']],
  ['남 · 꾀 많은 책사 (Cruz) — 지략·내정 높음 · 신중 · 무당 핏줄', 'm-sage', ['예.', '부르셨습니까.', '생각해 둔 바가 있사옵니다.']],
  ['남 · 늙은 장수·군주 (Arlo) — 군주 · 일편단심·백 사람의 이름', 'm-elder', ['음.', '부르셨사옵니까.', '늙은 몸이나마 받들겠사옵니다.']],
  ['남 · 매혹 (Neno) — 매혹', 'm-charm', ['음?', '저를 부르셨습니까.', '분부대로 하지요.']],
  ['여 · 당찬 젊은 무사 (Cleo) — 특성 없는 젊은 여장수', 'w-bright', ['네!', '부르셨사옵니까?', '분부만 내리소서!']],
  ['여 · 의젓한 장수 (Kira) — 여군주 · 무예·통솔 높음', 'w-cool', ['예.', '말씀하시지요.', '이 몸, 듣고 있사옵니다.']],
  ['여 · 요염한 꾀 (Lumi) — 매혹 · 반골 · 지략 높음 · 장사꾼', 'w-sly', ['어머.', '저를 찾으셨사옵니까?', '무엇이든 말씀만 하시어요.']],
  ['여 · 무녀 (Hali) — 무당 핏줄', 'w-shaman', ['하늘이 이르기를…', '부르셨사옵니까.', '신령께서 지켜보시옵니다.']],
]
let h = ''
for (const [title, k, lines] of GROUPS) {
  h += `<h2>${title}</h2>`
  lines.forEach((t, i) => {
    h += `<div class="row"><span class="no">${i + 1}</span><span class="nm">${t}</span><audio controls preload="none" src="voice/tap-${k}-${i + 1}.ogg"></audio></div>`
  })
}
const ARTS = [['snipe', '명궁의 한 발', '이 화살을 받아라!'], ['rite', '진중 굿', '천지신명이시여 굽어살피소서!'], ['sway', '항복 권유', '칼을 거두고 우리 편에 서라!'],
  ['stand', '버텨라', '한 걸음도 물러서지 마라!'], ['ambush', '샛길 기습', '지금이다 샛길로 쳐라!'], ['vanguard', '선봉에 선다', '나를 따르라!'],
  ['feint', '거짓 퇴각', '물러나는 척하라!'], ['order', '진을 다잡는다', '진을 갖춰라!'], ['shout', '큰 외침', '두려워 마라 우리가 이긴다!']]
h += `<h1 style="margin-top:40px">싸움 기술 외침 — 장수가 기술을 쓰면 컷과 함께</h1><p>애니·게임 성우처럼 · 가성 없이 가슴소리로 힘주어 (형 10-26). 결마다 아홉.</p>`
for (const [title, k] of GROUPS) {
  h += `<h2>${title}</h2>`
  ARTS.forEach(([a, nm, t], i) => {
    h += `<div class="row"><span class="no">${i + 1}</span><span class="nm">${nm} — ${t}</span><audio controls preload="none" src="voice/art-${k}-${a}.ogg"></audio></div>`
  })
}
document.getElementById('list').innerHTML = h
// 등용 첫마디 — 장수마다 하나 (voice/hire/<장수 id>.ogg · 대사는 src/realm/data/hire-lines.ts · 목록은 tools/hire-voice-list.ts --write)
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
fetch('voice/hire/lines.json').then((r) => r.json()).then((rows) => {
  let g = `<h1>등용 첫마디 — 내 사람이 되는 순간 (${rows.length}명)</h1><p>등용 장면에서 얼굴이 다 드러나면 그 장수가 이름 아래 「」 대사를 그대로 말한다. 결마다 묶어 한 번에 뽑고 빈 소리·글자 수로 잘랐다.</p>`
    + `<p>★ 어색한 줄은 "○○(장수 id) 다시"라고 말해 주면 그 장수 것만 다시 뽑는다 · 대사를 고치면 글과 소리를 함께 바꾼다.</p>`
  for (const [title, k] of GROUPS) {
    const mine = rows.filter((x) => x.kind === k)
    if (mine.length === 0) continue
    g += `<h2>${title} — ${mine.length}명</h2>`
    for (const x of mine) g += `<div class="row"><span class="no" style="min-width:96px;font-size:13px">${esc(x.name)}</span><span class="nm">${esc(x.text)} <code>${esc(x.id)}</code></span><audio controls preload="none" src="voice/hire/${encodeURIComponent(x.id)}.ogg"></audio></div>`
  }
  document.getElementById('hire').innerHTML = g + '<hr style="border:0;border-top:1px solid #2c333d;margin:40px 0 20px">'
}).catch(() => {})
</script>
</body></html>
