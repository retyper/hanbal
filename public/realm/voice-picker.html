<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>칠십팔국 목소리 고르기</title>
<style>
  :root { color-scheme: dark; }
  body { background:#171c23; color:#e2dbcd; margin:0; padding:22px 16px 60px; font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
  h1 { font-size:20px; letter-spacing:.06em; margin:0 0 6px; }
  h2 { font-size:15px; letter-spacing:.1em; color:#ffb347; margin:26px 0 4px; }
  p { color:#95a1ae; font-size:13px; line-height:1.7; max-width:760px; margin:6px 0 10px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:9px 0; border-top:1px solid #2c333d; }
  .no { font-weight:700; color:#ffb347; min-width:34px; font-size:15px; }
  .nm { font-size:13px; color:#ccd6e0; flex:1; min-width:160px; }
  .pick { color:#7fd17a; font-size:12px; }
  audio { height:34px; max-width:100%; }
  code { background:#232a33; padding:1px 5px; border-radius:3px; color:#ffd88f; }
</style></head><body>
<h1>칠십팔국 목소리 고르기 — 「네, 부르셨습니까」</h1>
<p>우리 장수 얼굴을 눌러 장수 판을 열 때 나오는 대답이다. 구글 AI 스튜디오 Gemini TTS(무료 목소리 + 사극 말투 지시)로 뽑았다.
<b class="pick">★ 지금 쓰는 것</b>이 게임에 붙어 있다. 들어 보고 <b>남·여 번호만 말해 주면</b> 바꾼다 (예: "남 2, 여 3"). 다 별로면 "다시"라고 하면 다른 목소리로 뽑는다.</p>
<p>★ 나는 소리를 못 듣는다 — 길이·빈 소리만 재서 잘랐다. 발음이 틀리거나 어색하면 바로 말해 줘.</p>
<div id="list"></div>
<script>
const GROUPS = [
  ['남자 장수 — Arlo (낮고 단단하게 · 사극 신하 말투)', [['call-m1'], ['call-m2'], ['call-m3', true]]],
  ['여자 장수 — Kira (맑고 의젓하게 · 사극 말투)', [['call-w1'], ['call-w2', true], ['call-w3']]],
]
let h = ''
for (const [title, items] of GROUPS) {
  h += `<h2>${title}</h2>`
  items.forEach(([f, on], i) => {
    h += `<div class="row"><span class="no">${i + 1}</span><span class="nm">${f}${on ? ' <b class="pick">★ 지금 쓰는 것</b>' : ''}</span><audio controls preload="none" src="voice/cand/${f}.ogg"></audio></div>`
  })
}
document.getElementById('list').innerHTML = h
</script>
</body></html>
