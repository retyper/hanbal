<h1>삼한열전 목소리 고르기 — 장수를 누르면 나오는 대답</h1>
<p>우리 장수 얼굴을 누르거나 장수가 이끄는 군대를 지도에서 고르면 그 장수가 곧바로 대답한다. 장수마다 아홉 결 가운데 하나 — 생김·특성·능력치로 고른다 (<code>src/ui/realm/voice.ts</code>).
결마다 대답 셋을 돌려 쓴다. 구글 AI 스튜디오 Gemini TTS(무료 목소리 + 사극 말투 지시)로 뽑았다.</p>
<p>★ 나는 소리를 못 듣는다 — 빈 소리로 잘랐다. 어색한 결·대사는 "○○ 다시"라고 말해 주면 그 결만 다시 뽑는다.</p>

h += `<h1 style="margin-top:40px">성우진 C — 사극 말투 (~하옵니다 · ~하겠사옵니다 · ~시옵소서)</h1><p>「~에요」「~할게요」 같은 말을 빼고 장수다운 사극 말로 다시 썼다 (챗지피티와 교차 검증). 부르는 말(주군·그대·전하)은 넣지 않았다. 장수 이름으로 셋씩 갈라 하나는 C 로 말한다. 어색한 결·대사는 「C ○○ 다시」라고 말해 주면 그것만 다시 뽑는다.</p>`
for (const [title, k] of GROUPS) {
  const g = CAST_C[k]
  if (g === undefined) { h += `<h2>${title.replace(/(.*?)/, '(C)')} — 아직 녹음 안 함</h2>`; continue }
  h += `<h2>${title.replace(/(.*?)/, '(' + g.v + ')')}</h2>`
  g.lines.forEach((t, i) => { h += `<div class="row"><span class="no">${i + 1}</span><span class="nm">${g.names[i].split('-')[0]} — ${t}</span><audio controls preload="none" src="voice/c/${g.names[i]}.ogg"></audio></div>` })

// CAST_C END
document.getElementById('list').innerHTML = h
// 등용 첫마디 — 장수마다 하나 (voice/hire/<장수 id>.ogg · 대사는 src/realm/data/hire-lines.ts · 목록은 tools/hire-voice-list.ts --write)
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
fetch('voice/hire/lines.json').then((r) => r.json()).then((rows) => {
  let g = `<h1>등용 첫마디 — 내 사람이 되는 순간 (${rows.length}명)</h1><p>등용 장면에서 얼굴이 다 드러나면 그 장수가 이름 아래 「」 대사를 그대로 말한다. 결마다 묶어 한 번에 뽑고 빈 소리·글자 수로 잘랐다.</p>`
    + `<p>★ 어색한 줄은 "○○(장수 id) 다시"라고 말해 주면 그 장수 것만 다시 뽑는다 · 대사를 고치면 글과 소리를 함께 바꾼다.</p>`
  for (const [title, k] of GROUPS) {
    const mine = rows.filter((x) => x.kind === k)
    if (mine.length === 0) continue
    g += `<h2>${title} — ${mine.length}명</h2>`
    for (const x of mine) g += `<div class="row"><span class="no" style="min-width:96px;font-size:13px">${esc(x.name)}</span><span class="nm">${esc(x.text)} <code>${esc(x.id)}</code></span><audio controls preload="none" src="voice/hire/${encodeURIComponent(x.id)}.ogg"></audio></div>`
  }
  document.getElementById('hire').innerHTML = g + '<hr style="border:0;border-top:1px solid #2c333d;margin:40px 0 20px">'
}).catch(() => {})
// 군장 말 — 남의 나라 군장이 알현·맺음 화면에서 하는 말 (voice/chief/<결>-<상황>-<a|p>.ogg · 대사는 src/ui/realm/chief-lines.ts · 목록은 tools/chief-voice-list.ts --write)
fetch('voice/chief/lines.json').then((r) => r.json()).then((rows) => {
  const got = rows.filter((x) => x.has).length
  let g = `<h1>군장 말 — 남의 나라 군장이 청을 걸고 · 맺고 · 물리칠 때 (${got}/${rows.length})</h1><p>사신의 청이 화면 가득 뜨거나 화친·동맹·조공·선물·거절을 맺은 화면에서 저쪽 군장이 말풍선 글 그대로 말한다. 군장 얼굴의 목소리 결 × 나라 성향 — 욕심 많은 나라는 적극, 조심스런 나라는 소극 (형 10-26).</p>`
    + `<p>★ 어색한 줄은 "○○ 결 △△ 적극 다시"라고 말해 주면 그 줄만 다시 뽑는다 · 대사를 고치면 글과 소리를 함께 바꾼다.</p>`
  for (const [title, k] of GROUPS) {
    const mine = rows.filter((x) => x.kind === k)
    if (mine.length === 0) continue
    g += `<h2>${title}</h2>`
    for (const x of mine) {
      const au = x.has ? `<audio controls preload="none" src="voice/chief/${x.file}.ogg"></audio>` : '<span class="pick" style="color:#95a1ae">아직 없음</span>'
      g += `<div class="row"><span class="no" style="min-width:120px;font-size:13px">${esc(x.sitName)} · ${x.mood === 'a' ? '적극' : '소극'}</span><span class="nm">${esc(x.text)}</span>${au}</div>`
    }
  }
  document.getElementById('chief').innerHTML = g + '<hr style="border:0;border-top:1px solid #2c333d;margin:40px 0 20px">'
  // 성우진 B 군장 (형 10-29) — 군장 얼굴로 반씩 갈라 B 는 다른 말·다른 목소리 (voice/b/chief · src/ui/realm/chief-lines-b.ts)
  return fetch('voice/b/chief/lines.json').then((r) => r.json()).then((rb) => {
    let gb = `<h1>군장 말 · 성우진 B (${rb.filter((x) => x.has).length}/${rb.length})</h1><p>같은 결·같은 성향이라도 군장 절반은 이 말로 한다.</p>`
    for (const [title, k] of GROUPS) {
      const mine = rb.filter((x) => x.kind === k)
      if (mine.length === 0) continue
      gb += `<h2>${title.replace(/\(.*?\)/, '(B)')}</h2>`
      for (const x of mine) gb += `<div class="row"><span class="no" style="min-width:120px;font-size:13px">${esc(x.sitName)} · ${x.mood === 'a' ? '적극' : '소극'}</span><span class="nm">${esc(x.text)}</span><audio controls preload="none" src="voice/b/chief/${x.file}.ogg"></audio></div>`
    }
    document.getElementById('chief').insertAdjacentHTML('beforeend', gb)
  })
}).catch(() => {})
</script>
