<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>칠십팔국 목소리 고르기</title>
<style>
  :root { color-scheme: dark; }
  body { background:#171c23; color:#e2dbcd; margin:0; padding:22px 16px 60px; font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
  h1 { font-size:20px; letter-spacing:.06em; margin:0 0 6px; }
  h2 { font-size:15px; letter-spacing:.1em; color:#ffb347; margin:26px 0 4px; }
  p { color:#95a1ae; font-size:13px; line-height:1.7; max-width:760px; margin:6px 0 10px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:9px 0; border-top:1px solid #2c333d; }
  .no { font-weight:700; color:#ffb347; min-width:34px; font-size:15px; }
  .nm { font-size:13px; color:#ccd6e0; flex:1; min-width:160px; }
  .pick { color:#7fd17a; font-size:12px; }
  audio { height:34px; max-width:100%; }
  code { background:#232a33; padding:1px 5px; border-radius:3px; color:#ffd88f; }
</style></head><body>
<div id="chief"></div>
<div id="hire"></div>
<h1>칠십팔국 목소리 고르기 — 장수를 누르면 나오는 대답</h1>
<p>우리 장수 얼굴을 누르거나 장수가 이끄는 군대를 지도에서 고르면 그 장수가 곧바로 대답한다. 장수마다 아홉 결 가운데 하나 — 생김·특성·능력치로 고른다 (<code>src/ui/realm/voice.ts</code>).
결마다 대답 셋을 돌려 쓴다. 구글 AI 스튜디오 Gemini TTS(무료 목소리 + 사극 말투 지시)로 뽑았다.</p>
<p>★ 나는 소리를 못 듣는다 — 빈 소리로 잘랐다. 어색한 결·대사는 "○○ 다시"라고 말해 주면 그 결만 다시 뽑는다.</p>
<div id="list"></div>
<script>
const GROUPS = [
  ['남 · 젊은 무사 (Enzo) — 특성 없는 젊은 장수 · 겁 많음', 'm-young', ['네!', '부르셨습니까!', '명만 내리십시오!']],
  ['남 · 거친 노장 (Daro) — 무예 높음 · 술꾼 · 잔치꾼 · 대장장이 · 철의 손', 'm-gruff', ['예이!', '무슨 일이오!', '싸울 일이오?']],
  ['남 · 꾀 많은 책사 (Cruz) — 지략·내정 높음 · 신중 · 무당 핏줄', 'm-sage', ['예.', '부르셨습니까.', '생각해 둔 바가 있사옵니다.']],
  ['남 · 늙은 장수·군주 (Arlo) — 군주 · 일편단심·백 사람의 이름', 'm-elder', ['음.', '부르셨사옵니까.', '늙은 몸이나마 받들겠사옵니다.']],
  ['남 · 매혹 (Neno) — 매혹', 'm-charm', ['음?', '저를 부르셨습니까.', '분부대로 하지요.']],
  ['여 · 당찬 젊은 무사 (Cleo) — 특성 없는 젊은 여장수', 'w-bright', ['네!', '부르셨사옵니까?', '분부만 내리소서!']],
  ['여 · 의젓한 장수 (Kira) — 여군주 · 무예·통솔 높음', 'w-cool', ['예.', '말씀하시지요.', '이 몸, 듣고 있사옵니다.']],
  ['여 · 요염한 꾀 (Lumi) — 매혹 · 반골 · 지략 높음 · 장사꾼', 'w-sly', ['어머.', '저를 찾으셨사옵니까?', '무엇이든 말씀만 하시어요.']],
  ['여 · 무녀 (Hali) — 무당 핏줄', 'w-shaman', ['하늘이 이르기를…', '부르셨사옵니까.', '신령께서 지켜보시옵니다.']],
]
let h = ''
for (const [title, k, lines] of GROUPS) {
  h += `<h2>${title}</h2>`
  lines.forEach((t, i) => {
    h += `<div class="row"><span class="no">${i + 1}</span><span class="nm">${t}</span><audio controls preload="none" src="voice/tap-${k}-${i + 1}.ogg"></audio></div>`
  })
}
// 분부 받듦 — 일을 확정할 때 (voice/obey-<결>-1..3.ogg · 대사는 docs/realm/VOICE-LINES.md · 형 10-27)
const OBEY = {
  'm-young': ['맡겨 주시오! 곧 해내겠소.', '알겠소, 바로 가겠소!', '분부대로 하겠소!'],
  'm-gruff': ['크하하, 맡겨 두시오!', '허허, 그쯤이야 문제없소.', '분부대로 합지요!'],
  'm-sage': ['분부대로 하겠습니다.', '헤아려 두었습니다. 다녀오지요.', '뜻대로 이루어 보겠습니다.'],
  'm-elder': ['허허, 늙은 몸이나마 다녀오리다.', '분부, 받들겠소.', '염려 마시오. 해내고 오리다.'],
  'm-charm': ['그대 부탁이라면야, 기꺼이.', '맡겨 주시오. 실망시키지 않으리다.', '분부대로 하지요.'],
  'w-bright': ['네! 맡겨 주세요!', '다녀올게요, 금방이에요!', '분부대로 할게요!'],
  'w-cool': ['분부대로 하겠습니다.', '알겠습니다. 다녀오지요.', '맡은 일은 해냅니다.'],
  'w-sly': ['후후, 그 정도쯤이야.', '분부대로 하지요. 기대하세요.', '맡겨만 주세요.'],
  'w-shaman': ['하늘의 뜻대로 하겠어요.', '방울이 길을 열어 줄 거예요.', '분부, 받들겠어요.'],
}
h += `<h1 style="margin-top:40px">분부 — 일을 맡겨 확정할 때</h1><p>사신·공작을 보내거나 원정·맡기기·이끌기·설득을 정하면 그 장수가 분부를 받든다. 고를 때는 위의 짧은 대답 · 확정에는 이것 (형 10-27). 결마다 셋을 돌려 쓴다.</p>`
for (const [title, k] of GROUPS) {
  h += `<h2>${title}</h2>`
  OBEY[k].forEach((t, i) => {
    h += `<div class="row"><span class="no">${i + 1}</span><span class="nm">${t}</span><audio controls preload="none" src="voice/obey-${k}-${i + 1}.ogg"></audio></div>`
  })
}
// 싸움 맡김 — 우리 장수가 싸움을 맡아 들 때 셋 · 맡긴 싸움이 끝나면 이김 · 짐 (voice/auto-<결>-1..3 · win · lose · 대사는 src/ui/realm/voice.ts AUTO_LINE · 형 10-27)
const AUTO = {
  'm-young': ["싸움은 제게 맡기시오!", "단숨에 깨뜨리고 오겠소!", "지켜보기만 하시오!", "이겼소! 보셨소?", "면목 없소… 다음엔 꼭!"],
  'm-gruff': ["크하하, 이 싸움 내가 맡소!", "한바탕 쓸어 버리고 오리다!", "술상이나 차려 두시오!", "크하하! 싱겁구먼!", "크윽, 이번엔 내가 졌소."],
  'm-sage': ["판은 이미 읽었습니다. 맡겨 주십시오.", "수를 두듯 이겨 보이겠습니다.", "서두르지 않고 이기겠습니다.", "헤아린 대로 되었습니다.", "수를 잘못 읽었습니다."],
  'm-elder': ["허허, 늙은 칼이라도 날은 서 있소.", "이 싸움, 내가 거두리다.", "조상께 부끄럽지 않게 싸우겠소.", "허허, 아직 쓸 만하지요.", "허허… 늙은 몸이 부끄럽소."],
  'm-charm': ["멋지게 이기고 오리다.", "그대는 웃으며 기다리시오.", "이 싸움, 내 몫으로 하지요.", "약속대로 이겼소.", "이런, 체면이 말이 아니군."],
  'w-bright': ["제가 다 이기고 올게요!", "맡겨 주세요, 금방이에요!", "보고만 계세요!", "이겼어요! 봤죠?", "분해요… 다음엔 꼭 이길게요!"],
  'w-cool': ["맡겨 주십시오. 이기고 오겠습니다.", "싸움은 제가 끝냅니다.", "물러서지 않겠습니다.", "이겼습니다.", "…송구합니다."],
  'w-sly': ["후후, 재미있게 놀다 올게요.", "저들, 금방 울게 될 거예요.", "제게 맡겨 두세요.", "후후, 너무 쉬웠네요.", "흥, 오늘은 봐준 거예요."],
  'w-shaman': ["하늘이 우리 편이에요. 맡겨 주세요.", "방울이 이길 길을 일러 줘요.", "별이 이긴다고 말하네요.", "하늘이 웃어요.", "하늘이 등을 돌렸어요…"],
}
h += `<h1 style="margin-top:40px">싸움 맡김 — 장수에게 싸움을 맡길 때 · 끝났을 때</h1><p>싸움 화면에서 「장수에게 맡긴다」를 누르면 총대장이 셋 가운데 하나를 말하고, 맡긴 싸움이 끝나면 이김·짐 한마디를 한다 (비기면 조용히).</p>`
for (const [title, k] of GROUPS) {
  h += `<h2>${title}</h2>`
  AUTO[k].forEach((t, i) => {
    const f = i < 3 ? String(i + 1) : i === 3 ? 'win' : 'lose'
    h += `<div class="row"><span class="no">${i < 3 ? i + 1 : i === 3 ? '이김' : '짐'}</span><span class="nm">${t}</span><audio controls preload="none" src="voice/auto-${k}-${f}.ogg"></audio></div>`
  })
}
const ARTS = [['snipe', '명궁의 한 발', '이 화살을 받아라!'], ['rite', '진중 굿', '천지신명이시여 굽어살피소서!'], ['sway', '항복 권유', '칼을 거두고 우리 편에 서라!'],
  ['stand', '버텨라', '한 걸음도 물러서지 마라!'], ['ambush', '샛길 기습', '지금이다 샛길로 쳐라!'], ['vanguard', '선봉에 선다', '나를 따르라!'],
  ['feint', '거짓 퇴각', '물러나는 척하라!'], ['order', '진을 다잡는다', '진을 갖춰라!'], ['shout', '큰 외침', '두려워 마라 우리가 이긴다!']]
h += `<h1 style="margin-top:40px">싸움 기술 외침 — 장수가 기술을 쓰면 컷과 함께</h1><p>애니·게임 성우처럼 · 가성 없이 가슴소리로 힘주어 (형 10-26). 결마다 아홉.</p>`
for (const [title, k] of GROUPS) {
  h += `<h2>${title}</h2>`
  ARTS.forEach(([a, nm, t], i) => {
    h += `<div class="row"><span class="no">${i + 1}</span><span class="nm">${nm} — ${t}</span><audio controls preload="none" src="voice/art-${k}-${a}.ogg"></audio></div>`
  })
}
document.getElementById('list').innerHTML = h
// 등용 첫마디 — 장수마다 하나 (voice/hire/<장수 id>.ogg · 대사는 src/realm/data/hire-lines.ts · 목록은 tools/hire-voice-list.ts --write)
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
fetch('voice/hire/lines.json').then((r) => r.json()).then((rows) => {
  let g = `<h1>등용 첫마디 — 내 사람이 되는 순간 (${rows.length}명)</h1><p>등용 장면에서 얼굴이 다 드러나면 그 장수가 이름 아래 「」 대사를 그대로 말한다. 결마다 묶어 한 번에 뽑고 빈 소리·글자 수로 잘랐다.</p>`
    + `<p>★ 어색한 줄은 "○○(장수 id) 다시"라고 말해 주면 그 장수 것만 다시 뽑는다 · 대사를 고치면 글과 소리를 함께 바꾼다.</p>`
  for (const [title, k] of GROUPS) {
    const mine = rows.filter((x) => x.kind === k)
    if (mine.length === 0) continue
    g += `<h2>${title} — ${mine.length}명</h2>`
    for (const x of mine) g += `<div class="row"><span class="no" style="min-width:96px;font-size:13px">${esc(x.name)}</span><span class="nm">${esc(x.text)} <code>${esc(x.id)}</code></span><audio controls preload="none" src="voice/hire/${encodeURIComponent(x.id)}.ogg"></audio></div>`
  }
  document.getElementById('hire').innerHTML = g + '<hr style="border:0;border-top:1px solid #2c333d;margin:40px 0 20px">'
}).catch(() => {})
// 군장 말 — 남의 나라 군장이 알현·맺음 화면에서 하는 말 (voice/chief/<결>-<상황>-<a|p>.ogg · 대사는 src/ui/realm/chief-lines.ts · 목록은 tools/chief-voice-list.ts --write)
fetch('voice/chief/lines.json').then((r) => r.json()).then((rows) => {
  const got = rows.filter((x) => x.has).length
  let g = `<h1>군장 말 — 남의 나라 군장이 청을 걸고 · 맺고 · 물리칠 때 (${got}/${rows.length})</h1><p>사신의 청이 화면 가득 뜨거나 화친·동맹·조공·선물·거절을 맺은 화면에서 저쪽 군장이 말풍선 글 그대로 말한다. 군장 얼굴의 목소리 결 × 나라 성향 — 욕심 많은 나라는 적극, 조심스런 나라는 소극 (형 10-26).</p>`
    + `<p>★ 어색한 줄은 "○○ 결 △△ 적극 다시"라고 말해 주면 그 줄만 다시 뽑는다 · 대사를 고치면 글과 소리를 함께 바꾼다.</p>`
  for (const [title, k] of GROUPS) {
    const mine = rows.filter((x) => x.kind === k)
    if (mine.length === 0) continue
    g += `<h2>${title}</h2>`
    for (const x of mine) {
      const au = x.has ? `<audio controls preload="none" src="voice/chief/${x.file}.ogg"></audio>` : '<span class="pick" style="color:#95a1ae">아직 없음</span>'
      g += `<div class="row"><span class="no" style="min-width:120px;font-size:13px">${esc(x.sitName)} · ${x.mood === 'a' ? '적극' : '소극'}</span><span class="nm">${esc(x.text)}</span>${au}</div>`
    }
  }
  document.getElementById('chief').innerHTML = g + '<hr style="border:0;border-top:1px solid #2c333d;margin:40px 0 20px">'
}).catch(() => {})
</script>
</body></html>
