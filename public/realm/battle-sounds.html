<h1>싸움 소리 고르기</h1>
<p>싸움판에서 나는 소리를 자리마다 모았다. <b style="color:#7fd17a">초록</b>이 지금 쓰는 것이다. ▶ 로 들어 보고, 바꾸고 싶은 자리에서 다른 것을 고르면 아래 칸에 적힌다. 다 고르면 「복사」를 눌러 나한테 붙여 주면 그대로 바꾼다.</p>
<p>10-25 형이 고른 것은 다 붙였다(초록). 맨 위 붉은 칸(사로잡음)은 밧줄 소리 후보를, 돌 굴리기는 땅울림 후보를, 졌다는 징 후보를 새로 받아 붙였다. 나는 소리를 못 듣는다 — 제목·길이·받은 수로만 골랐다.</p>

const pick = {}
let playing = null
const list = document.getElementById('list')
let h = ''
for (const s of DATA) {
  if (s === DATA[1]) h += '<h2>삼한열전 싸움 소리</h2>'
  if (s === DATA[0]) h += '<h2>아직 고를 것 — 활터 소리를 빌려 쓰는 자리</h2>'
  h += `<div class="slot${s.hwal ? ' sus' : ''}"><div class="sh"><b>${s.name}</b><small>${s.when}</small>${s.hwal ? '<span class="sus">활터 효과음 · 새 후보 붙임</span>' : ''}</div>`
  s.opts.forEach((o, i) => {
    h += `<div class="opt${o.cur ? ' cur' : ''}"><button class="pl" data-f="${o.f}">▶</button><label><input type="radio" name="${s.slot}" value="${i}"${o.cur && !s.hwal ? ' checked' : ''}><code>${o.code}</code>${o.cur ? ' ★ 지금' : ''}</label><span class="d">${o.d}</span></div>`
  })
  h += '</div>'
}
list.innerHTML = h
list.addEventListener('click', (e) => {
  const b = e.target.closest('button.pl')
  if (!b) return
  if (playing) { playing.a.pause(); playing.b.classList.remove('on') }
  if (playing && playing.b === b) { playing = null; return }
  const a = new Audio(b.dataset.f)
  a.play()
  b.classList.add('on')
  a.onended = () => { b.classList.remove('on'); if (playing && playing.b === b) playing = null }
  playing = { a, b }
})
list.addEventListener('change', (e) => {
  const r = e.target
  const s = DATA.find((x) => x.slot === r.name)
  const o = s.opts[Number(r.value)]
  if (o.cur) delete pick[s.slot]; else pick[s.slot] = `${s.name} (${s.slot}) → ${o.code}`
  const v = Object.values(pick)
  document.getElementById('ta').value = v.join('\n')
  document.getElementById('n').textContent = v.length
})
document.getElementById('cp').onclick = async () => {
  const t = document.getElementById('ta').value
  try { await navigator.clipboard.writeText(t); document.getElementById('ok').textContent = '복사했다' } catch { document.getElementById('ta').select() }
}
