# GitHub Pages 배포 — 푸시하면 빌드해서 올린다.
#
# ★ 게이트를 여기서도 돌린다. 로컬에서 초록불이었어도, 깨진 상태가 웹에 올라가는 것보다
#   Actions가 빨간불로 멈추는 게 낫다 (docs/ARCHITECTURE.md 의 정신).
#
# PUBLIC_BASE: Pages는 https://<계정>.github.io/<레포명>/ 처럼 서브경로로 붙는다.
#   이걸 안 주면 애셋 경로가 전부 루트를 가리켜 404가 난다 — 소리(public/sfx)까지 통째로.
name: deploy

on:
  push:
    branches: [master, main]
    # 지시 문서만 바뀐 push가 진행 중인 제품 배포를 취소하지 않게 한다.
    paths-ignore:
      - 'docs/realm/production/CODEX-SKILLBODY-REDO-20261117.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 푸시해도 마지막 것만 올라간다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm install --global npm@$(cat .npm-version)
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_BASE: /${{ github.event.repository.name }}/
      # 번들 예산 (GDD 1장 C6). npm run build 가 이미 부르지만 여기서 이름을 드러내
      # 둔다 — Actions 로그에서 "왜 빨간불인가"가 한 줄로 읽혀야 한다.
      - run: npm run budget
      # Pages 한도 1GB · 사이트 판만 줄인다 (원본·스팀 판은 그대로 · 무엇을 왜: tools/pages-shrink.mjs 머리말)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # 구운 결과 캐시 · 원본 내용 해시로 찾으니 새로 들어온 파일만 굽는다 (캐시가 없으면 다 새로 굽고 결과는 같다)
      - id: shrink-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pages-shrink
          key: pages-shrink-${{ github.sha }}
          restore-keys: pages-shrink-
      - id: shrink
        run: bash tools/pages-shrink.sh dist
      # 한도를 넘어 실패하거나 새 푸시로 취소돼도 여기까지 구운 것은 남긴다 (다음 배포가 이어서 굽는다)
      - if: always() && steps.shrink.outputs.cache-key != '' && steps.shrink.outputs.cache-key != steps.shrink-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pages-shrink
          key: ${{ steps.shrink.outputs.cache-key }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
