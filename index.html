<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c2129" />
    <meta name="color-scheme" content="dark" />
    <!-- 폰 홈화면에서 열었을 때 주소창 없이 뜬다 (설치 안내는 하지 않는다 — GDD 9장). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>신궁</title>
    <style>
      /* 첫 페인트가 0.3초 안에 되어야 한다 (제약 C6). 초기 스타일은 인라인.
         글꼴 파일(public/fonts)은 여기서 부르지 않는다 — <head>의 스타일시트는 렌더를
         막는다. ui/overlay.ts가 첫 프레임 뒤에 붙인다 (font-display: swap). */
      html, body {
        margin: 0; height: 100%; background: #1c2129; overscroll-behavior: none;
        overflow: hidden;
      }
      /* 글꼴 스택은 ui/overlay.ts · render/hud.ts 와 같은 것을 쓴다.
         여기서만 다르면 첫 페인트에 글꼴이 한 번 바뀌어 보인다. */
      body {
        display: block; color: #e2dbcd;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        /* 폰: 두 번 눌러 확대·길게 눌러 선택·눌림 표시를 전부 끈다.
           전부 조준을 끊는 동작이다 (C1: 손이 하는 일은 겨누고 놓는 것뿐). */
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none; user-select: none;
      }
      /* dvh 는 주소창까지 뺀 진짜 높이다. 이 화면은 스크롤이 없어(overflow:hidden)
         주소창이 접혔다 펴지지 않으므로, 값이 도중에 변하지 않는다.
         dvh 를 모르는 브라우저는 위의 100vh 에서 멈춘다. */
      #game {
        display: block; width: 100vw; height: 100vh; height: 100dvh;
        touch-action: none; cursor: crosshair;
      }
      /* 스플래시/로고 없음 — 탭 복귀 즉시 플레이 (제약 C1) */
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
