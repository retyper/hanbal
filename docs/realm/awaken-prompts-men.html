<style>
/* 판: 장수 초상과 같은 남색 판 위에 청동 띠 · 카드 격자 · 단일 어두운 결 (여장수 페이지와 같은 꼴) */
:root {
  --bg: #1c2129;
  --panel: #252b35;
  --line: #3a4250;
  --fg: #e7e2d6;
  --dim: #9aa0a8;
  --bronze: #c9a25a;
  --done: #5e8c6a;
  --display: "Nanum Myeongjo", "Batang", serif;
  --body: "Gowun Dodum", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 5vw, 38px); margin: 0; letter-spacing: .02em; text-wrap: balance; }
h1 span { color: var(--bronze); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
.how li { border-top: 2px solid var(--bronze); padding-top: 8px; color: var(--dim); font-size: 14px; }
.how b { color: var(--fg); display: block; font-weight: normal; font-family: var(--display); font-size: 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar input { flex: 1 1 200px; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 9px 12px; font: inherit; }
.chip { background: transparent; border: 1px solid var(--line); color: var(--dim); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--bronze); color: var(--bronze); }
.count { color: var(--dim); font-size: 13px; margin-left: auto; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 12px; align-items: start; }
.card.is-done { opacity: .55; }
.card img { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; background: var(--bg); }
.info { min-width: 0; display: grid; gap: 6px; }
.name { font-family: var(--display); font-size: 18px; font-weight: 700; line-height: 1.2; }
.meta { color: var(--dim); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
.tag { color: var(--bronze); }
.file { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--dim); word-break: break-all; }
.note { font-size: 12.5px; color: #e0b46a; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy { background: var(--bronze); color: #1c2129; border: 0; border-radius: 6px; padding: 7px 14px; font: inherit; font-weight: bold; cursor: pointer; }
.copy.ok { background: var(--done); color: var(--fg); }
.done { color: var(--dim); font-size: 13px; display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
details { grid-column: 1 / -1; font-size: 13px; color: var(--dim); }
details summary { cursor: pointer; }
details pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); padding: 10px; border-radius: 6px; color: var(--fg); font-size: 12.5px; max-height: 320px; overflow: auto; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
textarea.fallback { position: fixed; left: -9999px; }
</style>

const KIND = { W: '무장', A: '궁수', S: '책사', K: '왕', M: '무당', T: '장사꾼', H: '사냥꾼', B: '뱃사람', I: '대장장이', F: '일꾼' }

function agePhrase(a) {
  if (a <= 22) return 'in his early twenties'
  if (a <= 26) return 'in his mid-twenties'
  if (a <= 29) return 'in his late twenties'
  if (a <= 34) return 'in his early thirties'
  if (a <= 39) return 'in his late thirties'
  if (a <= 49) return 'in his forties'
  if (a <= 59) return 'in his fifties'
  if (a <= 69) return 'in his sixties'
  return 'in his seventies'
}
function tone(a) {
  if (a <= 29) return 'dashing and heroic'
  if (a >= 50) return 'dignified and commanding'
  return 'powerful and battle-worn'
}

function prompt([img, , age, , pose, outfit]) {
  return `This is an original character from my own Korean historical fantasy strategy game. The attached portrait is an AI-generated illustration of a fictional adult man ${agePhrase(age)}, not a real person. Create a square 1:1 image of the SAME character in his awakened form, the moment he reaches his full power.

Identity: keep the exact same face, age, ethnicity, hairstyle, facial hair, body build and color palette, so he is instantly recognizable as the same hero.

Framing: upper-body shot from just above the head to around the waist. The pose must be dynamic and asymmetric, not a frontal symmetrical bust: ${pose}. The face does not need to be centered, and one shoulder may turn away from the viewer. No open palm pushed toward the viewer.

Style: semi-realistic painterly splash art, the quality of a premium Korean MMORPG male class illustration, dramatic soft rim light, high detail. Plain very dark slate-blue studio background (#1c2129) with a stronger warm glow behind the shoulders. No scenery, landscape, buildings or sky.

Costume (the main focus): a high-fashion warrior design, ${tone(age)}, neither fully covered in armor nor bare. A strong, broad-shouldered silhouette true to his build: ${outfit}. Gilt-bronze ornaments, small iron lamellar plates edged in gold, comma-shaped jade (gogok) beads, silk and fur. Ancient Korean Samhan / Three Kingdoms motifs, reimagined boldly and ornately. Confident, majestic, powerful.

Expression: the same personality as the reference, but more intense and resolved, a fierce or serene inner fire in the eyes. The irises may glow faintly.

Power: an aura of light rising like heat haze, with small individual sparks and light motes drawn one by one, not a single blob. If he holds a weapon, it gleams with the same light.

Do NOT draw: a halo or disc behind the head, sun rays, any red circle or sun symbol, Japanese or Chinese style armor or clothing, ninja masks, katana, shuriken, horns, demonic features, any text, letters, banner, caption, watermark or frame.`
}

const KEY = 'awaken-done-men'
let done = {}
try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {} } catch (e) { done = {} }
function saveDone() { try { localStorage.setItem(KEY, JSON.stringify(done)) } catch (e) {} }

let filter = ''
const grid = document.getElementById('grid')
const q = document.getElementById('q')
const chips = document.getElementById('chips')
const count = document.getElementById('count')

for (const k of ['', ...Object.keys(KIND)]) {
  const b = document.createElement('button')
  b.className = 'chip'
  b.type = 'button'
  b.textContent = k ? KIND[k] : '전부'
  b.setAttribute('aria-pressed', String(k === filter))
  b.onclick = () => { filter = k; for (const c of chips.children) c.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-pressed', 'true'); render() }
  chips.appendChild(b)
}

function copyText(text, btn) {
  const ok = () => { btn.textContent = '복사됨'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('ok') }, 1600) }
  const fallback = () => {
    const t = document.createElement('textarea'); t.className = 'fallback'; t.value = text; document.body.appendChild(t); t.select()
    try { document.execCommand('copy'); ok() } catch (e) { btn.textContent = '아래 글을 직접 복사' }
    t.remove()
  }
  try { navigator.clipboard.writeText(text).then(ok, fallback) } catch (e) { fallback() }
}

function render() {
  const s = q.value.trim().toLowerCase()
  grid.textContent = ''
  let n = 0
  for (const h of H) {
    const [img, name, age, kind, , , note] = h
    if (filter && kind !== filter) continue
    if (s && !(name + img).toLowerCase().includes(s)) continue
    n++
    const dir = BUST_ONLY.has(img) ? 'bust' : 'bust-hd'
    const text = prompt(h)
    const card = document.createElement('article')
    card.className = 'card' + (done[img] ? ' is-done' : '')
    card.innerHTML = `
      <img src="bust/${img}.jpg" alt="${name}" loading="lazy">
      <div class="info">
        <div class="name">${name}</div>
        <div class="meta"><span>${age}살</span><span class="tag">${KIND[kind]}</span></div>
        <div class="file">public/realm/${dir}/${img}.jpg</div>
        ${note ? `<div class="note">${note}</div>` : ''}
        <div class="row">
          <button class="copy" type="button">복사</button>
          <label class="done"><input type="checkbox" id="d-${img}" ${done[img] ? 'checked' : ''}> 다 구움</label>
        </div>
      </div>
      <details><summary>프롬프트 보기</summary><pre></pre></details>`
    // 아티팩트로 올리면 bust/ 가 곁에 있고, 저장소에서 바로 열면 docs/realm 에서 public 으로 거슬러 간다
    const pic = card.querySelector('img')
    pic.onerror = () => { pic.onerror = null; pic.src = `../../public/realm/bust/${img}.jpg` }
    card.querySelector('pre').textContent = text
    card.querySelector('.copy').onclick = e => copyText(text, e.currentTarget)
    card.querySelector('input').onchange = e => { done[img] = e.target.checked; if (!done[img]) delete done[img]; saveDone(); card.classList.toggle('is-done', e.target.checked) }
    grid.appendChild(card)
  }
  const d = H.filter(h => done[h[0]]).length
  count.textContent = `${n}명 · 다 구움 ${d}/${H.length}`
}
q.oninput = render
render()
</script>
