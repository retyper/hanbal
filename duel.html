<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0806" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <title>장수 겨루기</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0806; color: #efe6d2; overscroll-behavior: none;
        font-family: 'Gowun Batang', 'Nanum Myeongjo', serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #duel { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #flag { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 0 26px; height: 64px; border-radius: 16px;
        border: 2px solid #f0c66a; background: linear-gradient(#5a2a14, #2c140a); color: #ffe7b0; font-family: inherit; font-weight: 800; font-size: 21px;
        box-shadow: 0 0 24px rgba(240,180,80,.45); display: flex; align-items: center; gap: 10px; animation: pulse 1.4s ease-in-out infinite; }
      #flag.hide { display: none; }
      @keyframes pulse { 50% { box-shadow: 0 0 40px rgba(255,200,100,.8); } }
      #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(6,4,3,.72); }
      #over.hide { display: none; }
      .card { max-width: 360px; width: calc(100% - 32px); padding: 22px 20px; border-radius: 18px; background: #17110c; border: 1px solid rgba(240,214,160,.3); text-align: center; }
      .card .big { font-size: 46px; margin: 2px 0 6px; font-weight: 800; }
      .card .sub { font-size: 16px; opacity: .85; margin-bottom: 8px; }
      .card .stats { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 15px; margin: 10px 0; }
      .card .auto { font-size: 14px; opacity: .75; }
      .card button { margin-top: 16px; width: 100%; height: 56px; border-radius: 14px; border: 0; background: #e2b45a; color: #241608; font-family: inherit; font-weight: 800; font-size: 20px; }
    </style>
  </head>
  <body>
    <!-- 장수 겨루기 시험판 2판 · 본편과 따로 (docs/realm/council/1109-battle.md · src/duel/sim.ts). 주소에 ?me=aryeong&foe=haebi&muMe=5&muFoe=5&seed=1 -->
    <canvas id="duel"></canvas>
    <button id="flag">⚔ 장수 겨루기</button>
    <div id="over" class="hide"></div>
    <script type="module" src="/src/duel-main.ts"></script>
  </body>
</html>
