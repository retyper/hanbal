<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0806" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <title>장수 겨루기</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0806; color: #efe6d2; overscroll-behavior: none;
        font-family: 'Gowun Batang', 'Nanum Myeongjo', serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #duel { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #pads { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 0 12px calc(14px + env(safe-area-inset-bottom)); box-sizing: border-box; touch-action: none; }
      .pad { flex: 1; height: min(92px, 20vh); border-radius: 18px; border: 2px solid rgba(240,214,160,.35); background: rgba(20,14,10,.72); color: #f3e3c0;
        font-family: inherit; font-weight: 700; font-size: 18px; line-height: 1.1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; touch-action: none; transition: transform .06s, background .06s; }
      .pad b { font-size: 30px; line-height: 1; }
      .pad.parry { flex: 1.35; border-color: rgba(255,226,150,.7); }
      .pad.on { transform: scale(.94); background: rgba(255,214,120,.35); }
      .pad.lock { opacity: .45; }
      #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(6,4,3,.72); }
      #over.hide { display: none; }
      .card { max-width: 360px; width: calc(100% - 32px); padding: 22px 20px; border-radius: 18px; background: #17110c; border: 1px solid rgba(240,214,160,.3); text-align: center; }
      .card h1 { margin: 0 0 14px; font-size: 26px; color: #ffd98a; }
      .card .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; text-align: left; font-size: 15px; }
      .card .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor; }
      .card button { margin-top: 16px; width: 100%; height: 56px; border-radius: 14px; border: 0; background: #e2b45a; color: #241608; font-family: inherit; font-weight: 800; font-size: 20px; }
      .card .big { font-size: 44px; margin: 4px 0 10px; }
      .card .stats { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 15px; margin: 10px 0; }
      .card .auto { font-size: 14px; opacity: .8; }
    </style>
  </head>
  <body>
    <!-- 장수 겨루기 시험판 — 본편과 따로 (docs/realm/council/1109-battle.md · src/duel/sim.ts). 주소에 ?me=aryeong&foe=haebi&muMe=5&muFoe=5&seed=1 -->
    <canvas id="duel"></canvas>
    <div id="pads">
      <div class="pad dodge" data-act="dodge"><b>↩</b>피하기</div>
      <div class="pad parry" data-act="parry"><b>🛡</b>받아치기</div>
      <div class="pad strike" data-act="strike"><b>⚔</b>치기</div>
    </div>
    <div id="over"></div>
    <script type="module" src="/src/duel-main.ts"></script>
  </body>
</html>
