<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f1217" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" sizes="32x32" href="realm-favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="64x64" href="realm-favicon-64.png?v=3" />
    <!-- 홈 화면에 앱으로 (형: "매번 웹페이지로 플레이해야돼?") — sw.js 는 활터와 같은 워커 -->
    <link rel="manifest" href="realm.webmanifest" />
    <link rel="apple-touch-icon" href="realm-icon-192.png?v=3" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <title>칠십팔국</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14181e; color: #e9e2d4; }
      /* 아이폰 — 가로로 돌렸을 때 글자를 멋대로 키우지 않게 · 끌어당겨 튕기지 않게 (형 10-24: "ios 에서 화면 구겨지고") */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior: none; }
      /* 아이폰 — 두 번 톡 쳐서 페이지가 커지지 않게 · 입력칸에 눌러도 확대되지 않게(16px 아래면 사파리가 키운다) (형 10-24: "ios 화면이 지멋대로 확대되고 안 돌아온다") */
      html, body { touch-action: manipulation; }
      input, select, textarea { font-size: 16px; }
      /* 스플래시 — 스크립트보다 먼저 뜬다. 먹빛 바탕에 청동 거울 문장이 숨 쉬듯 빛나고, 붓 한 획이 그어지며 받는 동안 기다린다.
         그림·글꼴을 다 받으면 걷힌다 (형 10-23: "게임 시작할 때 이미지 로딩되는 게 고스란히 보이는데 스플래시 스크린은 아직인가?") */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #0a0907 radial-gradient(ellipse at 50% 42%, #2a2218 0, #14110d 55%, #0a0907 100%); transition: opacity .7s ease, visibility .7s; }
      #splash.out { opacity: 0; visibility: hidden; }
      /* 고지문 — 첫 화면에서 옮겨 왔다 (형 10-28) */
      #splash .spnote { position: absolute; left: 16px; right: 16px; bottom: calc(5vh + env(safe-area-inset-bottom)); margin: 0; text-align: center; font: 12px/1.5 sans-serif; color: #cbbf9fb0; }
      #splash img { width: min(38vw, 170px); aspect-ratio: 1; opacity: 0; animation: spin 1.2s ease-out .1s forwards, spglow 3s ease-in-out 1.3s infinite; }
      /* 받는 막대 — 옻칠 홈에 단청 띠가 차오른다 (realm/ui/dancheong-tile.jpg · 제미나이 · 형 10-23: "꼬부랑 꼬부랑 … 한국 전통을 살려서") */
      .lbar { width: min(66vw, 340px); height: 20px; padding: 3px; box-sizing: content-box; border-radius: 3px; background: linear-gradient(#0b0806, #1a120c);
        box-shadow: inset 0 1px 3px #000, 0 0 0 1px #c9a45a, 0 0 0 3px #2a1c0e, 0 0 0 4px #8a6a3a, 0 6px 16px #000a; }
      .lbar i { display: block; height: 100%; width: 0; background: url(realm/ui/dancheong-tile.jpg) 0 50% / auto 100% repeat-x; box-shadow: 0 0 10px #ffd27a55, inset -2px 0 0 #fff4c8aa;
        transition: width .4s cubic-bezier(.3, .8, .4, 1); animation: lbarpre 1.6s ease-out .2s forwards; }
      @keyframes lbarpre { to { width: 28%; } }
      .lbar.go i { animation: none; }
      /* 오른쪽 아래 — 말 탄 궁수 그림자가 달린다 (여섯 컷 · public/realm/fx/run-strip.png · 제미나이 실루엣) */
      #splash .run { position: absolute; right: 6vw; bottom: 8vh; width: min(34vw, 150px); aspect-ratio: 170 / 165; background: url(realm/fx/run-strip.png) 0 0 / 600% 100% no-repeat;
        opacity: .7; animation: sprun .56s steps(6) infinite, spbob .28s ease-in-out infinite alternate; }
      @keyframes spin { from { opacity: 0; transform: scale(.85); filter: brightness(.4); } to { opacity: 1; transform: none; filter: none; } }
      @keyframes spglow { 0%, 100% { filter: drop-shadow(0 0 10px #e8b85a33); } 50% { filter: drop-shadow(0 0 26px #f0c86a99); } }
      @keyframes sprun { from { background-position-x: 0%; } to { background-position-x: 120%; } }
      @keyframes spbob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash .run { animation: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <!-- 칠십팔국 시험판 — 앱 화면 (docs/realm/FLOW.md §5). 활터는 index.html 그대로다. -->
    <div id="splash" aria-hidden="true"><img src="realm/logo/emblem.png" alt="" /><div class="lbar"><i></i></div><i class="run"></i><p class="spnote">본 게임은 역사 기록을 바탕으로 재구성한 창작물로, 등장하는 인물·국가·사건은 실제 역사와 다를 수 있습니다.</p></div>
    <main id="realm"></main>
    <script>
      // 앱으로 설치 — 크롬이 권할 때를 받아 둔다 (설정의 「앱으로 설치」 · app.ts installPrompt). 브라우저 전체 화면은 쓰지 않는다
      addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e })
    </script>
    <script type="module" src="/src/realm-main.ts"></script>
  </body>
</html>
